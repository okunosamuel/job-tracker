name: Daily job scan

on:
  schedule:
    # 11:00 UTC = 6 AM Eastern in winter, 7 AM in summer, so the email lands before 8 AM.
    # GitHub can start scheduled runs up to ~30 minutes late.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Run only these sources (comma separated, e.g. kpmg,adzuna). Leave empty for all."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Scan, save, remind, alert
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m tracker.main ${{ github.event.inputs.only }}

      # Recording each run in the repo also keeps GitHub from pausing the schedule,
      # which it does after 60 days without repository activity.
      - name: Record run
        if: always()
        run: |
          git config user.name "job-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/last_run.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Daily run $(date -u +%F)"
          git push || true
